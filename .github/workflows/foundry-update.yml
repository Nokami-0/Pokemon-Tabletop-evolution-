name: Package Foundry update

on:
  push:
    branches: [main]
    paths: [system.json, .github/workflows/foundry-update.yml]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Foundry ZIP and manifest together
        shell: bash
        run: |
          version=$(node -p "require('./system.json').version")
          if [ "$version" != "0.1.55" ]; then exit 0; fi
          package=dist/pokemon-tabletop-evolution-$version.zip
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("system.json","utf8"));
          manifest.download = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/main/dist/pokemon-tabletop-evolution-${manifest.version}.zip`;
          fs.writeFileSync("system.json",JSON.stringify(manifest,null,2)+"\n");
          JS
          for script in scripts/*.mjs data/*.mjs; do node --check "$script" || exit 1; done
          cp dist/pokemon-tabletop-evolution-0.1.50.zip "$package"
          zip -q "$package" system.json scripts/pte.mjs scripts/prerequisites.mjs data/catalog.mjs data/item-data.mjs data/class-effects.mjs data/class-grants.mjs styles/pte.css templates/actor.hbs templates/item.hbs
          unzip -tq "$package"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- system.json "$package"
          git commit -m "Publish direct Foundry download for v$version"
          git push origin HEAD:main
