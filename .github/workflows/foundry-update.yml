name: Package Foundry update

on:
  push:
    branches: [main]
    paths: [.github/workflows/foundry-update.yml]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Foundry ZIP and manifest together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=0.1.56
          package=dist/pokemon-tabletop-evolution-$version.zip
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("system.json","utf8"));
          manifest.version = "0.1.56";
          manifest.download = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/main/dist/pokemon-tabletop-evolution-${manifest.version}.zip`;
          fs.writeFileSync("system.json",JSON.stringify(manifest,null,2)+"\n");
          JS
          node --check scripts/pte.mjs
          cp dist/pokemon-tabletop-evolution-0.1.55.zip "$package"
          zip -q "$package" system.json scripts/pte.mjs
          unzip -tq "$package"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- system.json "$package"
          git commit -m "Publish Foundry v$version"
          git push origin HEAD:main
          gh release create "v$version" "$package" system.json --target "$(git rev-parse HEAD)" --title "Pokémon Tabletop Evolution v$version" --notes "Keeps Pokémon Roles and Abilities on Pokémon sheets and limits Trainer features to Trainer sheets."
