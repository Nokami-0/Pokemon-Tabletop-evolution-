name: Package Foundry update

on:
  push:
    branches: [main]
    paths: [.github/workflows/foundry-update.yml]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish trainer feature eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=0.1.82
          package=pokemon-tabletop-evolution-$version.zip
          gh release download v0.1.81 --pattern pokemon-tabletop-evolution-0.1.81.zip --output "$package"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("system.json","utf8"));
          manifest.version = "0.1.82";
          manifest.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${manifest.version}/pokemon-tabletop-evolution-${manifest.version}.zip`;
          fs.writeFileSync("system.json",JSON.stringify(manifest,null,2)+"\n");
          JS
          node --check scripts/pte.mjs
          node --check scripts/prerequisites.mjs
          zip -q "$package" system.json scripts/pte.mjs scripts/prerequisites.mjs
          unzip -tq "$package"
          gh release create "v$version" "$package" system.json --target "$GITHUB_SHA" --title "Pokémon Tabletop Evolution v$version" --notes "Trainer feature and talent pickers show eligible entries, with GM confirmation for explicit approval requirements."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system.json
          git commit -m "Publish the Foundry manifest for v$version"
          git push origin HEAD:main
