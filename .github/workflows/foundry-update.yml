name: Package Foundry update

on:
  push:
    branches: [main]
    paths: [.github/workflows/foundry-update.yml]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish equipment categories and effects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=0.1.85
          package=pokemon-tabletop-evolution-$version.zip
          gh release download v0.1.84 --pattern pokemon-tabletop-evolution-0.1.84.zip --output "$package"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("system.json","utf8"));
          manifest.version = "0.1.85";
          manifest.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${manifest.version}/pokemon-tabletop-evolution-${manifest.version}.zip`;
          fs.writeFileSync("system.json",JSON.stringify(manifest,null,2)+"\n");
          JS
          npm install --no-save --no-package-lock classic-level@3.0.0
          staging=$(mktemp -d)
          unzip -q "$package" 'packs/gear/*' -d "$staging"
          node tools/update-equipment.mjs "$staging/packs/gear"
          rm -f "$staging/packs/gear"/{LOCK,LOG,LOG.old}
          rm -rf packs/gear
          mkdir -p packs
          mv "$staging/packs/gear" packs/gear
          zip -qd "$package" 'packs/gear/*'
          for script in data/equipment.mjs data/item-data.mjs scripts/pte.mjs scripts/models.mjs scripts/rules.mjs; do node --check "$script"; done
          zip -qr "$package" system.json packs/gear data/equipment.mjs data/item-data.mjs scripts/pte.mjs scripts/models.mjs scripts/rules.mjs templates/actor.hbs
          unzip -tq "$package"
          gh release create "v$version" "$package" system.json --target "$GITHUB_SHA" --title "Pokémon Tabletop Evolution v$version" --notes "Separates armor and shields, adds equipment rules and automated bonuses, and expires scene potion bonuses."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system.json
          git commit -m "Publish the Foundry manifest for v$version"
          git push origin HEAD:main
