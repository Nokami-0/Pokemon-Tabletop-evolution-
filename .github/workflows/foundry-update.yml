name: Package Foundry update

on:
  push:
    branches: [main]
    paths: [.github/workflows/foundry-update.yml, tools/smoke-test.mjs]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish verified system build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=0.1.114
          package=pokemon-tabletop-evolution-$version.zip
          gh release download v0.1.113 --pattern pokemon-tabletop-evolution-0.1.113.zip --output "$package"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("system.json","utf8"));
          manifest.version = "0.1.114";
          manifest.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${manifest.version}/pokemon-tabletop-evolution-${manifest.version}.zip`;
          fs.writeFileSync("system.json",JSON.stringify(manifest,null,2)+"\n");
          JS
          zip -q "$package" system.json scripts/pte.mjs scripts/two-side-combat-tracker.mjs scripts/campaign-time.mjs templates/combat/two-side-tracker.hbs templates/campaign-time.hbs templates/actor.hbs styles/pte.css tools/smoke-test.mjs README.md
          unzip -p "$package" scripts/pte.mjs | grep "getSceneControlButtons" >/dev/null
          unzip -p "$package" templates/campaign-time.hbs >/dev/null
          node --check scripts/campaign-time.mjs
          unzip -tq "$package"
          npm install --no-save --no-package-lock classic-level@3.0.0 handlebars@4.7.8
          staging=$(mktemp -d -p "$PWD")
          unzip -q "$package" -d "$staging"
          node "$staging/tools/smoke-test.mjs"
          gh release create "v$version" "$package" system.json --target "$GITHUB_SHA" --title "Pokémon Tabletop Evolution v$version" --notes "Combines Battle Moves and Known Moves in the Moves tab."
