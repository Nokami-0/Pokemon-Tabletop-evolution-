name: Package Foundry update

on:
  push:
    branches: [main]
    paths: [system.json]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the updated system
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./system.json').version")
          package=pokemon-tabletop-evolution-$version.zip
          if [ "$version" != "0.1.54" ]; then exit 0; fi
          for script in scripts/*.mjs data/*.mjs; do node --check "$script" || exit 1; done
          cp dist/pokemon-tabletop-evolution-0.1.50.zip "$package"
          zip -q "$package" system.json scripts/pte.mjs scripts/prerequisites.mjs data/catalog.mjs data/item-data.mjs data/class-effects.mjs data/class-grants.mjs styles/pte.css templates/actor.hbs templates/item.hbs
          unzip -tq "$package"
          gh release create "v$version" "$package" system.json --target "$GITHUB_SHA" --title "Pokémon Tabletop Evolution v$version" --notes "Separates Trainer feature categories and displays Tier Level and Tier Value."
