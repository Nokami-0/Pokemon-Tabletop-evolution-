name: Package PTE 0.1.50
on:
  push:
    branches: [pte-package-initiative-0-1-50]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'd45f166c67afea4cd87bdc55993a256c7049e4ee'
          unzip -q dist/pokemon-tabletop-evolution-0.1.49.zip 'assets/pte-tokens/*'
          node --check scripts/pte.mjs
          zip -qr dist/pokemon-tabletop-evolution-0.1.50.zip system.json scripts styles templates data packs assets README.md
          unzip -tq dist/pokemon-tabletop-evolution-0.1.50.zip
          test "$(unzip -Z1 dist/pokemon-tabletop-evolution-0.1.50.zip | grep -c '\.webp$')" -eq 2004
          git reset --soft 'd45f166c67afea4cd87bdc55993a256c7049e4ee'
          git rm --cached .github/workflows/pte-init-staging.yml
          git add dist/pokemon-tabletop-evolution-0.1.50.zip
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Send initiative rolls to the Foundry Combat Tracker'
          git push origin HEAD:main
