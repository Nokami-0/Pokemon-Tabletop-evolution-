name: Package PTE 0.1.49
on:
  push:
    branches: [pte-package-search-0-1-49]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '81157259c3e8a0f12495b5d447a1b7434eb30cf8'
          unzip -q dist/pokemon-tabletop-evolution-0.1.48.zip 'assets/pte-tokens/*'
          for f in scripts/*.mjs; do node --check "$f"; done
          zip -qr dist/pokemon-tabletop-evolution-0.1.49.zip system.json scripts styles templates data packs assets README.md
          unzip -tq dist/pokemon-tabletop-evolution-0.1.49.zip
          test "$(unzip -Z1 dist/pokemon-tabletop-evolution-0.1.49.zip | grep -c '\.webp$')" -eq 2004
          git reset --soft '81157259c3e8a0f12495b5d447a1b7434eb30cf8'
          git rm --cached .github/workflows/pte-search-staging.yml
          git add dist/pokemon-tabletop-evolution-0.1.49.zip
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add searchable catalogs and separate Moves and Known Moves tabs'
          git push origin HEAD:main
