name: Package PTE 0.1.46
on:
  push:
    branches: [pte-package-sp-0-1-46]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'a24a6640af7baff42add8927f92404509e08b89a'
          unzip -q dist/pokemon-tabletop-evolution-0.1.45.zip 'assets/pte-tokens/*'
          for f in scripts/*.mjs; do node --check "$f"; done
          zip -qr dist/pokemon-tabletop-evolution-0.1.46.zip system.json scripts styles templates data packs assets README.md
          unzip -tq dist/pokemon-tabletop-evolution-0.1.46.zip
          test "$(unzip -Z1 dist/pokemon-tabletop-evolution-0.1.46.zip | grep -c '\.webp$')" -eq 2004
          git reset --soft 'a24a6640af7baff42add8927f92404509e08b89a'
          git rm --cached .github/workflows/pte-sp-staging.yml
          git add dist/pokemon-tabletop-evolution-0.1.46.zip
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Track Spirit Points and configurable SP costs on both sheets'
          git push origin HEAD:main
